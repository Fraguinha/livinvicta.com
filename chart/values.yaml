components:
  frontend:
    image: fraguinha/livinvicta.com-frontend:latest # {"$imagepolicy": "flux-system:livinvicta-frontend-policy"}
    port: 8080
    replicaCount: 3
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 40Mi
  backend:
    image: fraguinha/livinvicta.com-backend:latest # {"$imagepolicy": "flux-system:livinvicta-backend-policy"}
    port: 8080
    replicaCount: 3
    env:
      - name: PORT
        value: "8080"
      - name: NODE_ENV
        value: production
      - name: DATABASE
        valueFrom:
          secretKeyRef:
            name: livinvicta-secrets
            key: DATABASE
      - name: SECRET
        valueFrom:
          secretKeyRef:
            name: livinvicta-secrets
            key: SECRET
      - name: GOOGLE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: livinvicta-secrets
            key: GOOGLE_CLIENT_ID
      - name: GOOGLE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: livinvicta-secrets
            key: GOOGLE_CLIENT_SECRET
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        memory: 96Mi

ingress:
  className: traefik
  clusterIssuer: letsencrypt
  externalDnsTarget: ""
  hosts:
    - livinvicta.com
    - www.livinvicta.com
    - livinvicta.pt
    - www.livinvicta.pt
  paths:
    - path: /api
      pathType: Prefix
      component: backend
    - path: /
      pathType: Prefix
      component: frontend
  tls:
    secretName: livinvicta-tls-secret
